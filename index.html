<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estúdio IA PRO - Plataforma Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #07040d;
      background-image: radial-gradient(#26173e 1.2px, transparent 1.2px);
      background-size: 20px 20px;
      color: #f3e8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: rgba(18, 11, 29, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(139, 92, 246, 0.28);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
    }
    .neon-btn {
      background: linear-gradient(135deg, #7c3aed 0%, #9333ea 50%, #6d28d9 100%);
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.45);
    }
  </style>
</head>
<body class="min-h-screen pb-10">
  <header class="sticky top-0 z-30 glass-card border-b border-purple-500/20 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-purple-500 animate-pulse"></span>
      <h1 class="font-bold text-sm tracking-wider text-purple-100 uppercase">Estúdio IA PRO • Dashboard</h1>
    </div>
    <button onclick="abrirModalChave()" id="btnStatusChave" class="text-xs px-4 py-2 rounded-full bg-purple-950/90 border border-purple-500/40 text-purple-200 font-medium">
      🔑 Configurar API Key
    </button>
  </header>

  <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
    <!-- Bloco 1: Imagem de Referência -->
    <section class="glass-card rounded-2xl p-5 relative">
      <div class="flex items-center justify-between border-b border-purple-500/20 pb-3 mb-4">
        <div class="flex items-center gap-2">
          <span class="p-1.5 rounded-lg bg-purple-900/50 text-purple-300 text-xs">⬆️</span>
          <h2 class="font-bold text-xs tracking-wider uppercase text-purple-100">Imagem de Referência</h2>
        </div>
        <span class="text-[10px] text-purple-400 bg-purple-950/80 px-2.5 py-1 rounded-full border border-purple-500/30">Nó 01</span>
      </div>
      <label class="block w-full aspect-[9/14] max-h-[450px] rounded-xl border-2 border-dashed border-purple-500/30 hover:border-purple-400/70 transition cursor-pointer relative overflow-hidden bg-[#0c0716] flex flex-col items-center justify-center text-center p-4">
        <input type="file" id="inputRef" accept="image/*" class="hidden" onchange="carregarReferencia(event)" />
        <img id="previewRef" class="hidden w-full h-full object-cover rounded-lg" />
        <div id="placeholderRef" class="space-y-2">
          <div class="w-12 h-12 rounded-2xl bg-purple-900/40 border border-purple-500/40 flex items-center justify-center mx-auto text-xl">📸</div>
          <p class="text-xs font-semibold text-purple-100">Clique para enviar a foto de referência</p>
          <p class="text-[11px] text-purple-400">Pose, espelho, roupa ou cenário</p>
        </div>
      </label>
    </section>

    <!-- Bloco 2: Trocar Identidade & Google Flow -->
    <section class="glass-card rounded-2xl p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-purple-500/20 pb-3">
        <div class="flex items-center gap-2">
          <span class="p-1.5 rounded-lg bg-purple-900/50 text-purple-300 text-xs">🪄</span>
          <h2 class="font-bold text-xs tracking-wider uppercase text-purple-100">Trocar Identidade (Google Flow)</h2>
        </div>
        <span class="text-[10px] text-emerald-400 bg-emerald-950/70 px-2.5 py-1 rounded-full border border-emerald-500/30">Pronto</span>
      </div>

      <div id="boxResultado" class="w-full min-h-[160px] rounded-xl bg-[#0c0716] border border-purple-500/25 flex flex-col items-center justify-center p-4 text-center relative overflow-hidden">
        <p id="statusTexto" class="text-xs text-purple-400/70">Resultado e Prompt do Flow aparecerão aqui</p>
        <img id="imgResultado" class="hidden w-full max-h-[380px] object-contain rounded-lg mb-2" />
        <div id="boxPromptFlow" class="hidden w-full text-left mt-2 bg-purple-950/60 border border-purple-500/30 rounded-lg p-3">
          <div class="flex justify-between items-center mb-1">
            <span class="text-[10px] font-bold uppercase text-purple-300">Prompt Pronto (Google Flow):</span>
            <button onclick="copiarPrompt()" class="text-[10px] bg-emerald-600 hover:bg-emerald-500 text-white px-2 py-0.5 rounded font-semibold">Copiar</button>
          </div>
          <p id="textoPromptFlow" class="text-[11px] text-purple-100 leading-relaxed select-all"></p>
        </div>
      </div>

      <div>
        <label class="text-[10px] font-bold uppercase tracking-wider text-purple-300/80 block mb-1">Modelo de Processamento</label>
        <select id="selectModelo" class="w-full bg-[#150d24] border border-purple-500/30 rounded-xl px-3 py-2.5 text-xs text-purple-100 font-medium">
          <option value="gemini-2.5-flash">✦ Gemini Flash (Estável)</option>
        </select>
      </div>

      <div>
        <label class="text-[10px] font-bold uppercase tracking-wider text-purple-300/80 block mb-1">Instrução Opcional</label>
        <input type="text" id="inputInstrucao" value="Mantém rigorosamente a pose e o cenário, aplicando a identidade da influencer!" class="w-full bg-[#150d24] border border-purple-500/30 rounded-xl p-2.5 text-xs text-purple-100" />
      </div>

      <div>
        <div class="flex justify-between text-[10px] text-purple-300/80 mb-1.5">
          <span class="font-bold uppercase">Sua Influencer (Fotos)</span>
          <span id="contadorInf">0/4</span>
        </div>
        <div class="flex items-center gap-2 overflow-x-auto pb-1">
          <div id="listaInfluencer" class="flex gap-2"></div>
          <label class="w-16 h-16 shrink-0 rounded-xl border border-dashed border-purple-500/40 bg-[#150d24] flex flex-col items-center justify-center cursor-pointer text-purple-300">
            <input type="file" accept="image/*" multiple class="hidden" onchange="adicionarInfluencer(event)" />
            <span class="text-lg leading-none">+</span>
            <span class="text-[9px] mt-0.5">Adicionar</span>
          </label>
        </div>
      </div>

      <button onclick="executarGeracao()" id="btnGerar" class="w-full neon-btn text-white font-bold text-xs uppercase tracking-wider py-3.5 rounded-xl flex items-center justify-center gap-2">
        <span>✨ GERAR IDENTIDADE & PROMPT</span>
      </button>
    </section>
  </main>

  <div id="modalChave" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="glass-card max-w-md w-full rounded-2xl p-6 space-y-4 border border-purple-500/40">
      <h3 class="font-bold text-sm text-purple-100 uppercase">🔑 Chave API Google AI Studio</h3>
      <input type="password" id="inputApiKey" placeholder="AIzaSy..." class="w-full bg-[#0c0716] border border-purple-500/40 rounded-xl p-3 text-xs text-white" />
      <div class="flex justify-end gap-2">
        <button onclick="fecharModalChave()" class="px-4 py-2 rounded-xl text-xs text-purple-300 bg-purple-950/50">Cancelar</button>
        <button onclick="salvarChave()" class="px-4 py-2 rounded-xl text-xs font-bold text-white neon-btn">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    let imagemRefBase64 = null, imagemRefMime = "image/jpeg", fotosInfluencer = [];
    window.onload = () => atualizarStatusChave();

    function atualizarStatusChave() {
      const chave = localStorage.getItem("estudio_ia_api_key");
      const btn = document.getElementById("btnStatusChave");
      if (chave && chave.startsWith("AIza")) {
        btn.innerHTML = "✅ Chave Ativa";
        btn.className = "text-xs px-4 py-2 rounded-full bg-emerald-950/90 border border-emerald-500/40 text-emerald-300 font-medium";
      }
    }
    function abrirModalChave() {
      document.getElementById("inputApiKey").value = localStorage.getItem("estudio_ia_api_key") || "";
      document.getElementById("modalChave").classList.remove("hidden");
      document.getElementById("modalChave").classList.add("flex");
    }
    function fecharModalChave() { document.getElementById("modalChave").classList.add("hidden"); }
    function salvarChave() {
      const val = document.getElementById("inputApiKey").value.trim();
      if (!val) return alert("Cole uma chave válida começando com AIza...");
      localStorage.setItem("estudio_ia_api_key", val);
      atualizarStatusChave();
      fecharModalChave();
    }
    function carregarReferencia(e) {
      const file = e.target.files[0];
      if (!file) return;
      imagemRefMime = file.type || "image/jpeg";
      const reader = new FileReader();
      reader.onload = (ev) => {
        imagemRefBase64 = ev.target.result.split(",")[1];
        const img = document.getElementById("previewRef");
        img.src = ev.target.result;
        img.classList.remove("hidden");
        document.getElementById("placeholderRef").classList.add("hidden");
      };
      reader.readAsDataURL(file);
    }
    function adicionarInfluencer(e) {
      Array.from(e.target.files).forEach(file => {
        if (fotosInfluencer.length >= 4) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          fotosInfluencer.push({ base64: ev.target.result.split(",")[1], mime: file.type || "image/jpeg", url: ev.target.result });
          renderizarInfluencers();
        };
        reader.readAsDataURL(file);
      });
    }
    function removerInfluencer(idx) { fotosInfluencer.splice(idx, 1); renderizarInfluencers(); }
    function renderizarInfluencers() {
      document.getElementById("contadorInf").innerText = `${fotosInfluencer.length}/4`;
      document.getElementById("listaInfluencer").innerHTML = fotosInfluencer.map((f, idx) => `
        <div class="relative w-16 h-16 rounded-xl overflow-hidden border border-purple-400/60 shrink-0">
          <img src="${f.url}" class="w-full h-full object-cover" />
          <button onclick="removerInfluencer(${idx})" class="absolute top-0.5 right-0.5 bg-black/80 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center">×</button>
        </div>
      `).join("");
    }
    async function executarGeracao() {
      const apiKey = localStorage.getItem("estudio_ia_api_key");
      if (!apiKey) return abrirModalChave();
      if (!imagemRefBase64) return alert("Envie a Imagem de Referência!");
      
      const btn = document.getElementById("btnGerar"), statusTexto = document.getElementById("statusTexto");
      btn.disabled = true; btn.innerHTML = "⏳ A processar no servidor...";
      statusTexto.innerText = "A enviar dados para a IA...";

      try {
        const modeloEscolhido = document.getElementById("selectModelo").value;
        const parts = [
          { text: `Substitua a pessoa da imagem de referência pelas fotos da influencer fornecidas, preservando perfeitamente a pose, cenário e iluminação. Instrução extra: ${document.getElementById("inputInstrucao").value}` },
          { inline_data: { mime_type: imagemRefMime, data: imagemRefBase64 } }
        ];
        fotosInfluencer.forEach(f => parts.push({ inline_data: { mime_type: f.mime, data: f.base64 } }));

        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modeloEscolhido}:generateContent?key=${apiKey}`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts }], generationConfig: { responseModalities: ["TEXT", "IMAGE"] } })
        });
        const data = await resp.json();
        if (data.error) throw new Error(data.error.message);

        let achou = false, texto = "";
        data.candidates?.[0]?.content?.parts?.forEach(p => {
          if (p.inlineData || p.inline_data) {
            const id = p.inlineData || p.inline_data;
            const img = document.getElementById("imgResultado");
            img.src = `data:${id.mimeType || id.mime_type};base64,${id.data}`;
            img.classList.remove("hidden"); achou = true;
          }
          if (p.text) texto += p.text + "\n";
        });

        if (texto.trim()) {
          document.getElementById("boxPromptFlow").classList.remove("hidden");
          document.getElementById("textoPromptFlow").innerText = texto.trim();
        }
        statusTexto.innerText = achou ? "✅ Sucesso absoluto!" : "✅ Prompt gerado para o Flow!";
      } catch (err) { 
        statusTexto.innerText = "⚠️ Aviso de tráfego: Tente novamente em instantes.";
        alert("Detalhe do erro: " + err.message);
      } finally { 
        btn.disabled = false; btn.innerHTML = "<span>✨ GERAR IDENTIDADE & PROMPT</span>"; 
      }
    }
    function copiarPrompt() {
      navigator.clipboard.writeText(document.getElementById("textoPromptFlow").innerText);
      alert("Prompt copiado com sucesso!");
    }
  </script>
</body>
</html>
